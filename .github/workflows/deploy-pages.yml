name: Deploy Nexus static site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use deterministic Node runtime
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify repository hygiene
        run: node scripts/repository-hygiene-regression.cjs

      - name: Verify checkout auth-session safety
        run: node scripts/auth-session-checkout-regression.cjs

      - name: Verify launch-critical cancellation and outage safeguards
        run: node scripts/cancellation-outage-launch-regression.cjs

      - name: Verify admin pilot grant safeguards
        run: node scripts/admin-pilot-grant-regression.cjs

      - name: Verify legal, indexing, and founder trust safeguards
        run: node scripts/legal-trust-launch-regression.cjs

      - name: Verify admin analytics insights
        run: node scripts/admin-analytics-insights-regression.cjs

      - name: Verify credential integrity safeguards
        run: node scripts/credential-integrity-regression.cjs

      - name: Verify buyer webhook setup safeguards
        run: node scripts/buyer-webhook-setup-regression.cjs

      - name: Verify opt-in webhook usage and legacy compatibility
        run: node scripts/buyer-webhook-usage-regression.cjs

      - name: Verify buyer webhook event mapping
        run: |
          node scripts/buyer-webhook-event-mapping-regression.cjs
          node --experimental-strip-types scripts/buyer-webhook-event-mapping-semantic-regression.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          for path in \
            assets \
            pages \
            docs \
            custom-business-automation \
            customer-support-automation \
            lead-automation \
            reporting-automation \
            social-listening-automation
          do
            if [ -e "$path" ]; then
              cp -R "$path" "dist/$path"
            fi
          done

          for file in \
            index.html \
            404.html \
            llms.txt \
            robots.txt \
            sitemap.xml \
            site.webmanifest \
            favicon.ico \
            favicon.PNG \
            _headers
          do
            if [ -f "$file" ]; then
              cp "$file" dist/
            fi
          done

          echo "nexus-ai.software" > dist/CNAME
          touch dist/.nojekyll

          find dist -type d -name node_modules -prune -exec rm -rf {} +
          find dist -type f -size +95M -print -delete

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

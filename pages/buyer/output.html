<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/nexus.css?v=20260713-code-stability">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/config.js?v=20260713-code-stability"></script>

  <title>Automation Output | Nexus</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicons/favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#2563ff">
  <style>
    .managed-file-delivery {
      display: grid;
      gap: 18px;
      place-items: start;
      padding: clamp(22px, 4vw, 38px);
      border: 1px solid rgba(37, 99, 255, 0.2);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(37, 99, 255, 0.08), rgba(255, 255, 255, 0.96));
    }

    .managed-file-delivery h3,
    .managed-file-delivery p {
      margin: 0;
    }

    .managed-file-preview { width: 100%; overflow: hidden; border: 1px solid rgba(37, 99, 255, 0.18); border-radius: 18px; background: #fff; }
    .managed-file-preview-frame { display: block; width: 100%; min-height: min(72vh, 820px); border: 0; background: #fff; }
    .managed-file-preview-image { display: block; width: 100%; max-height: 78vh; object-fit: contain; background: #f3f6fb; }
    .managed-file-preview video, .managed-file-preview audio { display: block; width: 100%; background: #101828; }
    .managed-file-preview-note { padding: 12px 16px; color: var(--text-muted, #596579); font-size: .85rem; border-top: 1px solid #e8edf6; background: #f8faff; }
    .managed-office-consent { display: grid; gap: 12px; justify-items: start; padding: 22px; }

    .managed-file-delivery-name {
      color: var(--text-muted, #596579);
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body data-page="buyer-output">
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="/">
        <span>Nexus&nbsp;</span>
      </a>

      <nav class="nav-links">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/pages/marketplace">Marketplace</a>
        <a class="nav-link active" href="/pages/buyer/dashboard.html">Dashboard</a>
        <a class="nav-link" href="/pages/contact">Support</a>
        <button class="btn btn-secondary btn-small" type="button" onclick="NexusDB.signOut()">Logout</button>
      </nav>
    </div>
  </header>

  <main class="buyer-output-page">
    <section class="container">
      <div id="outputRoot">
        <div class="card">
          <h2>Loading output...</h2>
          <p>Please wait while Nexus loads your automation result.</p>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="/assets/js/nexus-ui.js?v=20260713-code-stability"></script>
  <script src="/assets/js/nexus-db.js?v=20260819-managed-collections"></script>

  <script>
    function getParam(name) {
      return new URLSearchParams(location.search).get(name);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function dateLabel(value) {
      if (!value) return "Not recorded";
      return new Date(value).toLocaleString();
    }

    function outputTypeLabel(value) {
      const raw = String(value || "report").trim();
      return raw
        .replaceAll("_", " ")
        .replaceAll("-", " ")
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function adminDeliveryMeta(output) {
      const content = output?.content_json && typeof output.content_json === "object"
        ? output.content_json
        : {};
      const meta = content.nexus_admin_delivery;
      return meta && typeof meta === "object" && String(meta.source || "") === "admin_manual"
        ? meta
        : null;
    }

    function isAdminDeliveredOutput(output) {
      return Boolean(adminDeliveryMeta(output));
    }

    function managedFileName(output) {
      return String(adminDeliveryMeta(output)?.file_name || "Customer deliverable");
    }

    let managedOfficeViewUrl = "";

    function managedFileExtension(output) {
      const name = managedFileName(output).toLowerCase();
      return name.match(/\.([a-z0-9]+)$/)?.[1] || "";
    }

    function enableOfficePreview() {
      if (!managedOfficeViewUrl) return;
      const approved = window.confirm("PowerPoint, Word, and Excel previews are provided by Microsoft Office. Continuing shares a temporary 15-minute private file link with Microsoft. Continue?");
      if (!approved) return;
      const frame = document.getElementById("managedOfficePreviewFrame");
      const consent = document.getElementById("managedOfficeConsent");
      if (!frame) return;
      frame.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(managedOfficeViewUrl)}`;
      frame.hidden = false;
      if (consent) consent.hidden = true;
    }

    function renderManagedFilePreview(output, viewUrl = "") {
      if (!viewUrl) return `<div class="managed-file-preview-note">The secure preview is temporarily unavailable. Reload this page to request a new link.</div>`;
      const extension = managedFileExtension(output);
      const mime = String(adminDeliveryMeta(output)?.file_type || "").toLowerCase();
      const safeUrl = escapeHtml(viewUrl);
      if (["png", "jpg", "jpeg", "gif", "webp"].includes(extension) || mime.startsWith("image/")) return `<div class="managed-file-preview"><img class="managed-file-preview-image" src="${safeUrl}" alt="${escapeHtml(output.title || managedFileName(output))}"></div>`;
      if (extension === "pdf" || mime === "application/pdf") return `<div class="managed-file-preview"><iframe class="managed-file-preview-frame" src="${safeUrl}#toolbar=1&navpanes=0" title="PDF preview" referrerpolicy="no-referrer"></iframe></div>`;
      if (["ppt", "pptx", "doc", "docx", "xls", "xlsx"].includes(extension)) return `<div class="managed-file-preview"><div class="managed-office-consent" id="managedOfficeConsent"><strong>Preview this Office file</strong><p>Microsoft Office can render this file after you approve sharing a temporary 15-minute private link.</p><button class="btn btn-secondary" type="button" onclick="enableOfficePreview()">Preview with Microsoft Office</button></div><iframe class="managed-file-preview-frame" id="managedOfficePreviewFrame" title="Microsoft Office file preview" referrerpolicy="no-referrer" allowfullscreen hidden></iframe></div>`;
      if (["mp4", "webm", "mov"].includes(extension) || mime.startsWith("video/")) return `<div class="managed-file-preview"><video controls preload="metadata" src="${safeUrl}">Your browser cannot preview this video.</video></div>`;
      if (["mp3", "wav", "m4a"].includes(extension) || mime.startsWith("audio/")) return `<div class="managed-file-preview"><audio controls preload="metadata" src="${safeUrl}">Your browser cannot preview this audio.</audio></div>`;
      if (["txt", "md", "csv"].includes(extension) || mime.startsWith("text/")) return `<div class="managed-file-preview"><iframe class="managed-file-preview-frame" src="${safeUrl}" title="Text file preview" referrerpolicy="no-referrer"></iframe></div>`;
      return `<div class="managed-file-preview-note">This file format does not have a browser preview. Use Download original below.</div>`;
    }

    function developerName(output) {
      if (isAdminDeliveredOutput(output)) return "Nexus";
      const nested = output?.customer_automations?.developers || {};
      const direct = output?.developers || {};
      return nested.display_name || direct.display_name || "Nexus";
    }

    function outputFormatLabel(output) {
      if (output.file_url || adminDeliveryMeta(output)?.storage_path) return "File";
      if (output.content_html) return "HTML report";
      if (output.content_text) return "Text report";
      return "Structured data";
    }

    function outputHtmlForDisplay(value) {
      const source = String(value || "");
      if (!source) return "";

      const parsed = new DOMParser().parseFromString(source, "text/html");

      parsed.querySelectorAll("a[href]").forEach(link => {
        const href = String(link.getAttribute("href") || "").trim();
        if (!href || href.startsWith("#")) return;

        if (/^(?:javascript|data|vbscript):/i.test(href)) {
          link.removeAttribute("href");
          link.removeAttribute("target");
          return;
        }

        link.setAttribute("target", "_blank");
        const relValues = new Set(
          String(link.getAttribute("rel") || "").split(/\s+/).filter(Boolean)
        );
        relValues.add("noopener");
        relValues.add("noreferrer");
        link.setAttribute("rel", [...relValues].join(" "));
      });

      return `<!DOCTYPE html>\n${parsed.documentElement.outerHTML}`;
    }

    function renderOutputBody(output, downloadUrl = "", viewUrl = "") {
      if (isAdminDeliveredOutput(output)) {
        const fileName = managedFileName(output);
        return `
          <div class="managed-file-delivery">
            <span class="eyebrow">Private Nexus delivery</span>
            <h3>${escapeHtml(output.title || fileName)}</h3>
            <p>${escapeHtml(output.summary || "A file has been delivered securely to your Nexus account.")}</p>
            ${renderManagedFilePreview(output, viewUrl)}
            <p class="managed-file-delivery-name">${escapeHtml(fileName)}</p>
            ${
              downloadUrl
                ? `<a class="btn btn-primary" href="${escapeHtml(downloadUrl)}" target="_blank" rel="noopener">Download original</a>`
                : `<p>The secure download link is temporarily unavailable. Reload this page to request a new link.</p>`
            }
          </div>
        `;
      }

      if (output.content_html) {
        return `
          <div class="output-frame-shell">
            <iframe
              id="outputHtmlFrame"
              class="output-html-frame"
              title="Automation output report"
              sandbox="allow-popups allow-popups-to-escape-sandbox"
            ></iframe>
          </div>
        `;
      }

      if (output.content_text) {
        return `<pre class="output-text output-reader-text">${escapeHtml(output.content_text)}</pre>`;
      }

      return `<pre class="output-text output-reader-text">${escapeHtml(JSON.stringify(output.content_json || {}, null, 2))}</pre>`;
    }

    function outputHistoryRows(outputs, currentId) {
      const history = (outputs || [])
        .filter(item => item.id !== currentId)
        .slice(0, 8);

      if (!history.length) {
        return `<div class="buyer-output-history-empty">No previous outputs in this collection yet.</div>`;
      }

      return history.map(item => `
        <a class="buyer-output-history-link" href="/pages/buyer/output.html?id=${encodeURIComponent(item.id)}">
          <div>
            <strong>${escapeHtml(item.title || "Automation output")}</strong>
            <span>${escapeHtml(dateLabel(item.created_at))}</span>
          </div>
        </a>
      `).join("");
    }

    async function initOutputPage() {
      const root = document.getElementById("outputRoot");
      const outputId = getParam("id");

      const user = await NexusDB.requireBuyer(location.pathname + location.search);
      if (!user) return;

      if (!outputId) {
        root.innerHTML = `
          <div class="card">
            <h2>Output not found</h2>
            <p>No output ID was provided.</p>
            <a class="btn btn-primary" href="/pages/buyer/dashboard.html">Back to dashboard</a>
          </div>
        `;
        return;
      }

      const { data: output, error } = await NexusDB.getBuyerAutomationOutput(outputId);

      if (error || !output) {
        root.innerHTML = `
          <div class="card">
            <h2>Output not found</h2>
            <p>This output could not be loaded.</p>
            <a class="btn btn-primary" href="/pages/buyer/dashboard.html">Back to dashboard</a>
          </div>
        `;
        return;
      }

      const product = output.automations || {};
      const customerAutomation = output.customer_automations || {};
      const builder = developerName(output);
      const createdDate = dateLabel(output.created_at);
      const collectionId = String(adminDeliveryMeta(output)?.collection_id || "");
      const historyResult = collectionId
        ? await NexusDB.listBuyerManagedDeliverablesForCollection(collectionId)
        : output.customer_automation_id
          ? await NexusDB.listOutputsForCustomerAutomation(output.customer_automation_id)
          : { data: [] };
      const outputHistory = historyResult?.data || [];
      const adminDelivered = isAdminDeliveredOutput(output);
      let outputFileUrl = String(output.file_url || "").trim();
      let outputViewUrl = outputFileUrl;
      if (adminDelivered && adminDeliveryMeta(output)?.storage_path) {
        const { data: signedFile } = await NexusDB.signManagedDeliverableOutput(output.id);
        outputFileUrl = String(signedFile?.download_url || outputFileUrl || "").trim();
        outputViewUrl = String(signedFile?.view_url || outputViewUrl || "").trim();
        managedOfficeViewUrl = outputViewUrl;
      }
      root.innerHTML = `
        <div class="buyer-output-reader">
          <div class="buyer-output-reader-toolbar">
            <a class="btn btn-secondary btn-small" href="/pages/buyer/dashboard.html?tab=outputs">
              Back to outputs
            </a>

            <div>
              <a class="btn btn-secondary btn-small" href="/pages/buyer/dashboard.html?tab=automations">
                My automations
              </a>
              ${
                outputFileUrl
                  ? `<a class="btn btn-primary btn-small" href="${escapeHtml(outputFileUrl)}" target="_blank" rel="noopener">${adminDelivered ? "Download file" : "Open file"}</a>`
                  : ""
              }
            </div>
          </div>

          <section class="buyer-output-reader-hero">
            <div class="automation-icon ${escapeHtml(product.color || "")}">
              ${escapeHtml(product.icon || "AI")}
            </div>

            <div>
              <span class="${NexusUI.pillClass(product.color || "blue")}">
                ${escapeHtml(product.category || outputTypeLabel(output.output_type))}
              </span>
              <h1>${escapeHtml(output.title || "Automation output")}</h1>
              <p>${escapeHtml(output.summary || "Your automation completed and produced this output.")}</p>

              <div class="buyer-output-reader-meta">
                <span>${escapeHtml(product.title || customerAutomation.name || "Automation")}</span>
                <span>${adminDelivered ? "Delivered by" : "Built by"} ${escapeHtml(builder)}</span>
                <span>${escapeHtml(createdDate)}</span>
              </div>
            </div>
          </section>

          <div class="buyer-output-reader-grid">
            <aside class="buyer-output-context-panel">
              <section>
                <span class="eyebrow">Output details</span>
                <div class="buyer-output-detail-list">
                  <div>
                    <span>${adminDelivered && collectionId ? "Collection" : "Automation"}</span>
                    <strong>${escapeHtml(product.title || customerAutomation.name || "Automation")}</strong>
                  </div>
                  <div>
                    <span>${adminDelivered ? "Delivered by" : "Builder"}</span>
                    <strong>${escapeHtml(builder)}</strong>
                  </div>
                  <div>
                    <span>Output type</span>
                    <strong>${escapeHtml(outputTypeLabel(output.output_type))}</strong>
                  </div>
                  <div>
                    <span>Format</span>
                    <strong>${escapeHtml(outputFormatLabel(output))}</strong>
                  </div>
                  <div>
                    <span>Created</span>
                    <strong>${escapeHtml(createdDate)}</strong>
                  </div>
                </div>
              </section>

              <section>
                <span class="eyebrow">Previous outputs</span>
                <div class="buyer-output-history-list">
                  ${outputHistoryRows(outputHistory || [], output.id)}
                </div>
              </section>
            </aside>

            <section class="buyer-output-report-panel">
              <div class="buyer-output-report-head">
                <div>
                  <span class="eyebrow">${adminDelivered ? "Delivered file" : "Automation result"}</span>
                  <h2>${escapeHtml(output.title || "Output")}</h2>
                </div>
                <span>${escapeHtml(outputFormatLabel(output))}</span>
              </div>

              ${renderOutputBody(output, outputFileUrl, outputViewUrl)}
            </section>
          </div>
        </div>
      `;

      const frame = document.getElementById("outputHtmlFrame");
      if (frame && output.content_html) {
        frame.srcdoc = outputHtmlForDisplay(output.content_html);
      }
    }

    document.addEventListener("DOMContentLoaded", initOutputPage);
  </script>
</body>
</html>

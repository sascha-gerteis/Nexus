<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
  <title>Page not found | Nexus</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/css/nexus.css">
  <style>
    :root { color-scheme: dark; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 15%, rgba(111, 85, 255, .22), transparent 34rem),
        radial-gradient(circle at 85% 80%, rgba(0, 209, 178, .12), transparent 32rem),
        #080a12;
      color: #f7f8ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .not-found-shell { width: min(760px, calc(100% - 32px)); padding: 32px 0; }
    .not-found-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .not-found-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(135deg, #735cff, #00cdb5);
      box-shadow: 0 10px 32px rgba(96, 78, 255, .32);
    }
    .not-found-card {
      margin-top: 24px;
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid rgba(255, 255, 255, .11);
      border-radius: 28px;
      background: rgba(16, 18, 31, .82);
      box-shadow: 0 30px 90px rgba(0, 0, 0, .32);
      backdrop-filter: blur(18px);
    }
    .not-found-code {
      margin: 0 0 14px;
      color: #9d91ff;
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 { max-width: 580px; margin: 0; font-size: clamp(2.2rem, 7vw, 4.6rem); line-height: .98; letter-spacing: -.06em; }
    .not-found-copy { max-width: 570px; margin: 22px 0 0; color: #b6bbcd; font-size: 1.05rem; line-height: 1.7; }
    .not-found-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    .not-found-action {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 13px;
      color: #f7f8ff;
      background: rgba(255, 255, 255, .05);
      text-decoration: none;
      font-weight: 750;
    }
    .not-found-action.primary { border-color: transparent; background: linear-gradient(135deg, #735cff, #5a45e8); }
    .not-found-action:focus-visible { outline: 3px solid rgba(0, 205, 181, .55); outline-offset: 3px; }
    .not-found-note { margin: 28px 0 0; color: #858ba0; font-size: .88rem; }
    @media (max-width: 520px) {
      .not-found-actions { flex-direction: column; }
      .not-found-action { width: 100%; box-sizing: border-box; }
    }
  </style>
</head>
<body>
  <main class="not-found-shell">
    <a class="not-found-brand" href="/" aria-label="Nexus home">
      <span class="not-found-mark" aria-hidden="true">N</span>
      <span>Nexus</span>
    </a>
    <section class="not-found-card" aria-labelledby="not-found-title">
      <p class="not-found-code">Error 404</p>
      <h1 id="not-found-title">This page took the wrong turn.</h1>
      <p class="not-found-copy">The link may be outdated or the page may have moved. Your account, purchases, and delivered outputs are unaffected.</p>
      <div class="not-found-actions">
        <a class="not-found-action primary" href="/">Browse marketplace</a>
        <a class="not-found-action" href="/pages/buyer/dashboard.html">Open dashboard</a>
        <a class="not-found-action" href="/pages/contact.html">Contact support</a>
      </div>
      <p class="not-found-note">If you followed a Nexus link, send it to support so we can repair the route.</p>
    </section>
  </main>
</body>
</html>
